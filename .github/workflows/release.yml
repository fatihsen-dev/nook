name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh scripts/package-app.sh "$version" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Nook.dmg dist/Nook.dmg.sha256 dist/Nook.zip dist/Nook.zip.sha256 install.sh \
            --title "Nook ${GITHUB_REF_NAME#v}" \
            --generate-notes
