name: Website

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "website/**"
      - "install.sh"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_DOMAIN: nook.fatihsen.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R website/. _site/
          cp install.sh _site/install.sh
          printf '%s\n' "$SITE_DOMAIN" > _site/CNAME
          version="$(git describe --tags --abbrev=0 --match 'v*')"
          sed -i -E "s#<span data-release-version>[^<]*</span>#<span data-release-version>${version}</span>#" _site/index.html
          grep -q "<span data-release-version>${version}</span>" _site/index.html \
            || { echo "::error::website/index.html has no <span data-release-version> to show ${version} in"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
